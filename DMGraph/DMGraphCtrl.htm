<!--

Sub BtnSin_onclick
	On Error Resume Next
	Dim dmGraphCtrl 
	Set dmGraphCtrl = document.getElementById("DMGraphCtrl")
	Dim idx : idx = dmGraphCtrl.Elements.Selected
	If idx < 0 Then
		MsgBox("Error: please create and select an element first." & vbCrLf & "(Double click to see porperty pages)")
	Else
		Dim selElement 
		Set selElement = dmGraphCtrl.Elements.Item(idx)
		Dim i
		Dim x()
		Dim y()
		ReDim x(100)
		ReDim y(100)
		For i=0  To 100
			x(i) = i/5
			y(i) = Sin( x(i) )
		Next
		selElement.Plot x, y
		dmGraphCtrl.AutoRange()
	End If
	If Err.number <> 0 Then
		MsgBox Err.Description
	End If
End Sub

Sub Clear_graph_onclick
	On Error Resume Next
	Dim dmGraphCtrl 
	Set dmGraphCtrl = document.getElementById("DMGraphCtrl")
	Call dmGraphCtrl.ClearGraph()
	If Err.number <> 0 Then
		MsgBox Err.Description
	End If
End Sub

Sub Auto_range_onclick
	On Error Resume Next
	Dim dmGraphCtrl 
	Set dmGraphCtrl = document.getElementById("DMGraphCtrl")
	Call dmGraphCtrl.AutoRange()
	If Err.number <> 0 Then
		MsgBox Err.Description
	End If
End Sub

-->
